<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري تسجيل الدخول بحساب Google...</title>
  <style>
    body {
      font-family: 'Tajawal', 'Cairo', sans-serif;
      background: #08091e;
      color: #e8f4fd;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(79,195,247,0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>جاري تسجيل الدخول بحساب Google...</p>
  </div>
  <script>
    (function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const idToken = params.get('id_token');

      if (!idToken) {
        document.body.innerHTML = '<div class="container"><p style="color:#ff8585;">لم يتم العثور على رمز الوصول</p><a href="/login" style="color:#4fc3f7;">العودة لتسجيل الدخول</a></div>';
        return;
      }

      const API_BASE = 'https://hadmaj-api.info1703.workers.dev';

      fetch(API_BASE + '/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: idToken }),
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('sessionId', data.sessionId);
          window.location.href = '/';
        } else {
          document.body.innerHTML = '<div class="container"><p style="color:#ff8585;">' + (data.error || 'خطأ في تسجيل الدخول') + '</p><a href="/login" style="color:#4fc3f7;">العودة لتسجيل الدخول</a></div>';
        }
      })
      .catch(function() {
        document.body.innerHTML = '<div class="container"><p style="color:#ff8585;">تعذّر الاتصال بالخادم</p><a href="/login" style="color:#4fc3f7;">العودة لتسجيل الدخول</a></div>';
      });
    })();
  </script>
</body>
</html>
